#
# Prefix
#
set -g prefix C-a
unbind C-b
bind C-a send-prefix

#
# Options
#
set -g allow-rename off
set -g base-index 1
set -g escape-time 0
set -g focus-events on
set -g history-limit 5000000
set -g mouse on
set -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 0
set -g set-clipboard on
set -g status-style bg=default
set -g status-position top
set -g status-left-length 250
setw -g remain-on-exit off

#
# Vi / copy mode
#
set -g mode-keys vi
set -g status-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
# PageUp enters copy mode; full-screen apps (vim, less) and copy mode get the key as is.
# PageDown is native in copy-mode-vi; leave copy mode with q.
bind-key -n PPage if-shell -F '#{||:#{alternate_on},#{pane_in_mode}}' 'send-keys PPage' 'copy-mode -u'
# prefix C-b: same as PageUp, for keyboards without PageUp; C-b/C-f then page in copy-mode-vi.
bind-key C-b copy-mode -u
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'pbcopy'" \
  "bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'xclip -sel clipboard'"

#
# Windows
#

# C-a W: new window named after the task, in the current pane's directory.
bind-key W command-prompt -p "task:" "new-window -n '%%' -c '#{pane_current_path}'"

#
# Panes and status bar
#

# Pane number and title on the top border of every pane.
set -g pane-border-status top
set -g display-panes-time 3000
set -g window-status-current-format '#[reverse] #I:#W#{?window_flags,#{window_flags}, } #[default]'

set -g window-status-activity-style 'fg=yellow,bold'
set -g window-status-bell-style 'fg=red,bold'

set -g status-left "[#[bold]#{session_name}] "

#
# Agent radar
#

# C-a R: toggle silence monitoring (10 s) for the current window.
bind-key R if-shell -F '#{monitor-silence}' { setw monitor-silence 0 ; display-message 'radar: off' } { setw monitor-silence 10 ; display-message 'radar: 10s' }

# C-a A: windows from all sessions that went silent (~) or rang the bell (!).
bind-key A if-shell -F '#{S:#{W:#{?#{||:#{window_silence_flag},#{window_bell_flag}},1,}}}' { choose-tree -Zw -f '#{||:#{window_silence_flag},#{window_bell_flag}}' } { display-message 'radar: nobody waiting' }

# C-a a: all windows with the radar on, from all sessions.
bind-key a choose-tree -Zw -f '#{monitor-silence}'

#
# Sessions
#

# C-a j: directory picker that opens or switches to a session (bin/tj).
bind-key j display-popup -E -w 80% -h 70% "$HOME/.local/bin/tj"
